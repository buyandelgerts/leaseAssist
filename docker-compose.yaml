version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rental_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rental_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql

volumes:
  pgdata: